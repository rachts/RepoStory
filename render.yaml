services:
  - type: web
    name: repostory-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.3.0

  - type: web
    name: repostory-worker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:worker
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.3.0

